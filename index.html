<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple School Clicker Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin-bottom: 80px;
    }

    /* Scrollable shop panel setup */
    .vertical-scroll-box {
      overflow-y: scroll; 
      height: 250px; 
      border: 2px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .scroll-btn {
      font-size: 20px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      border: 1px solid #999;
      background-color: #f8f9fa;
    }

    .scroll-btn:hover {
      background-color: #e2e6ea;
    }

    .main-clicker {
      height: 80px; 
      font-size: 25px;
      font-weight: bold;
      background-color: #007bff;
      color: white;
      border: none;
    }

    .main-clicker:hover {
      background-color: #0056b3;
    }

    .bottom-button-container {
      position: fixed;
      bottom: 15px;         
      left: 0;
      width: 100%;          
      display: flex;
      justify-content: center; 
      gap: 12px;            
      z-index: 1000;        
    }

    .bottom-btn {
      font-size: 15px;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #fff;
    }

    .bottom-btn:hover {
      background-color: #f0f0f0;
    }

    /* Quick escape panic button styling */
    .panic-btn {
      position: fixed; 
      top: 10px; 
      right: 10px; 
      font-size: 14px; 
      background-color: #dc3545; 
      color: white; 
      font-weight: bold;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .panic-btn:hover {
      background-color: #bd2130;
    }
  </style>
</head>
<body>

<script>
// Game state variables
let score = 0;
let resetcheck = 0;
let clickvalue = 1;
let pluscost = 50;
let xtwocost = 500;
let plustencost = 500; 
let modecount = 0;
let totalclicks = 0;
let plusonepurchases = 0;
let xtwopurchases = 0;
let plustenpurchases = 0; 
</script>

<h1>Simple Clicker Game</h1>
<p>Designed for School Use</p>

<!-- Tracking Headers -->
<h2 id="scr">Score: 0</h2>
<h3 id="pwr">Click Power: 1</h3>
<h3 id="upgrdplusone">Points Required to Next +1 Upgrade: 50</h3>
<h3 id="upgrdxtwo">Points Required to Next x2 Upgrade: 500</h3>
<h3 id="upgrdplusten">Points Required to Next +10 Upgrade: 500</h3> 
<h3 id="mode">Hard Mode : OFF</h3>

<!-- Scrollable Action Box -->
<div class="vertical-scroll-box">

  <!-- Main Clicker Button -->
  <button class="scroll-btn main-clicker" onclick="
    totalclicks++;
    score += clickvalue;
    resetcheck = 0;
    updateUI();
    if (modecount % 2 != 0) { this.blur(); }
  ">Click to Score</button>

  <!-- +1 Upgrade Button -->
  <button class="scroll-btn" onclick="
    if (score >= pluscost) {
      plusonepurchases++;
      score -= pluscost;
      clickvalue += 1; 
      pluscost = Math.round(pluscost * 1.5);
      updateUI();
    } else {
      alert('You don\'t have enough! Required: ' + (pluscost - score) + ' points');
    }
  ">+1 Click Power</button>

  <!-- x2 Upgrade Button -->
  <button class="scroll-btn" onclick="
    if (score >= xtwocost) {
      xtwopurchases++;
      score -= xtwocost;
      clickvalue *= 2; 
      xtwocost = Math.round(xtwocost * 2.5);
      updateUI();
    } else {
      alert('You don\'t have enough! Required: ' + (xtwocost - score) + ' points');
    }
  ">x2 Click Power</button>

  <!-- +10 Upgrade Button -->
  <button class="scroll-btn" onclick="
    if (score >= plustencost) {
      plustenpurchases++;
      score -= plustencost;
      clickvalue += 10; 
      plustencost = Math.round(plustencost * 1.8); 
      updateUI();
    } else {
      alert('You don\'t have enough! Required: ' + (plustencost - score) + ' points');
    }
  ">+10 Click Power</button>

</div>

<!-- Top Panic Button -->
<button class="panic-btn" onclick="panic();">
  PRESS WHEN IN TROUBLE OR CLICK ESC
</button>

<!-- Center-Bottom Row Utility Controls -->
<div class="bottom-button-container">
  <button class="bottom-btn" onclick="
    modecount++;
    mode.innerText = (modecount % 2 == 0) ? 'Hard Mode: OFF' : 'Hard Mode: ON';
  ">Toggle Difficulty</button>

  <button class="bottom-btn" onclick="
    alert('Stats:\nTotal clicks: ' + totalclicks + '\n+1 Upgrades: ' + plusonepurchases + '\nx2 Upgrades: ' + xtwopurchases + '\n+10 Upgrades: ' + plustenpurchases);
  ">Click to See Stats</button>

  <button class="bottom-btn" onclick="
    if (resetcheck == 1) {
      score = 0; pluscost = 50; xtwocost = 500; plustencost = 500; clickvalue = 1; modecount = 0; resetcheck = 0;
      updateUI();
      mode.innerText = 'Hard Mode: OFF';
      alert('Reset!');
    } else {
      resetcheck++; 
      alert('Warning: This will reset progress permanently! Press again to confirm.');
    }
  ">Click to Reset</button>
</div>

<script>
// Refreshes HUD labels accurately 
function updateUI() {
  scr.innerText = 'Score: ' + score;
  pwr.innerText = 'Click Power: ' + clickvalue;
  
  upgrdplusone.innerText = (score >= pluscost) ? 'Points Required to Next +1 Upgrade: Upgrade Can be Bought!' : 'Points Required to Next +1 Upgrade: ' + (pluscost - score);
  upgrdxtwo.innerText = (score >= xtwocost) ? 'Points Required to Next x2 Upgrade: Upgrade Can be Bought!' : 'Points Required to Next x2 Upgrade: ' + (xtwocost - score);
  upgrdplusten.innerText = (score >= plustencost) ? 'Points Required to Next +10 Upgrade: Upgrade Can be Bought!' : 'Points Required to Next +10 Upgrade: ' + (plustencost - score);
}

// Panic redirects directly to Google Classroom dashboard layout
function panic() {
  window.open('https://google.com', '_self');
}

// Hotkey mappings
window.addEventListener("keydown", function(event) {
  if (event.key === "Escape" || event.key === "Esc") { panic(); }
});

window.addEventListener("keydown", function(event) {
  if (event.altKey && event.shiftKey && event.key.toLowerCase() === 'd') {
    alert('Developer Mode enabled.');
    score = Number(prompt("Enter score:", score));
    clickvalue = Number(prompt("Enter click power:", clickvalue));
    updateUI();
  }
});
</script>

</body>
</html>
